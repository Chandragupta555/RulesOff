<body class="text-on-background min-h-screen flex flex-col font-body-md overflow-x-hidden selection:bg-primary-container selection:text-black pb-24">

</header>
<main class="flex-grow px-container-padding pt-section-gap max-w-md mx-auto w-full flex flex-col gap-section-gap">
<!-- Header -->
<div class="text-center space-y-base">
<h1 class="font-headline-lg text-headline-lg text-on-surface">WHERE DO YOU STAY?</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Select your hostel to view the local midnight menu.</p>
</div>
<!-- Hostel Grid -->
<div class="grid grid-cols-2 gap-element-gap" id="hostel-grid">
<!-- Shivalik -->
<button class="hostel-card bg-surface-dim border border-[#1F1F1F] rounded-DEFAULT p-4 flex flex-col items-center justify-center gap-3 transition-all duration-200 hover:border-surface-variant active:scale-95 text-center relative overflow-hidden group min-h-[120px]"><div class="absolute top-2 right-2 bg-primary-container/10 px-2 py-1 rounded text-[10px] text-primary-container font-bold uppercase tracking-wider z-10">Boys</div>

<span class="font-label-lg text-label-lg text-on-surface z-10">Shivalik</span>
</button>
<!-- Aravali -->
<button class="hostel-card bg-surface-dim border border-[#1F1F1F] rounded-DEFAULT p-4 flex flex-col items-center justify-center gap-3 transition-all duration-200 hover:border-surface-variant active:scale-95 text-center relative overflow-hidden group min-h-[120px]"><div class="absolute top-2 right-2 bg-primary-container/10 px-2 py-1 rounded text-[10px] text-primary-container font-bold uppercase tracking-wider z-10">Boys</div>
<div class="absolute inset-0 bg-gradient-to-b from-transparent to-surface opacity-50"></div>

</button>
<!-- Kurukshetra -->
<button class="hostel-card bg-surface-dim border border-[#1F1F1F] rounded-DEFAULT p-4 flex flex-col items-center justify-center gap-3 transition-all duration-200 hover:border-surface-variant active:scale-95 text-center relative overflow-hidden group min-h-[120px]"><div class="absolute top-2 right-2 bg-primary-container/10 px-2 py-1 rounded text-[10px] text-primary-container font-bold uppercase tracking-wider z-10">Boys</div>

<span class="material-symbols-outlined text-3xl text-on-surface-variant transition-colors group-hover:text-primary z-10" data-icon="flag">flag</span>
<span class="font-label-lg text-label-lg text-on-surface z-10">Kurukshetra</span>
</button>
<!-- Himalaya -->
<button class="hostel-card bg-surface-dim border border-[#1F1F1F] rounded-DEFAULT p-4 flex flex-col items-center justify-center gap-3 transition-all duration-200 hover:border-surface-variant active:scale-95 text-center relative overflow-hidden group min-h-[120px]">
<div class="absolute inset-0 bg-gradient-to-b from-transparent to-surface opacity-50"></div>

</div>
<p class="font-label-sm text-label-sm text-on-surface-variant/70 text-center mt-2 px-4 leading-relaxed">
                This locks your local shelf — you can change it later from Settings if you switch hostels.
            </p>

<!-- Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full p-container-padding bg-gradient-to-t from-[#050505] via-[#050505] to-transparent pt-12 z-40 flex justify-center pb-12">
<button class="w-full max-w-md bg-primary-container text-black font-headline-md text-headline-md uppercase tracking-wider rounded-DEFAULT py-4 px-6 shadow-[0_4px_20px_rgba(255,95,31,0.3)] hover:shadow-[0_4px_25px_rgba(255,95,31,0.5)] active:scale-95 transition-all duration-150 flex items-center justify-center gap-2 opacity-50 cursor-not-allowed" id="enter-shop-btn">
            ENTER THE SHOP
            <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
<script>
        const cards = document.querySelectorAll('.hostel-card');
        const roomInput = document.getElementById('room-number');
        const enterBtn = document.getElementById('enter-shop-btn');
        let selectedHostel = false;

        function checkFormValidity() {
            if (selectedHostel && roomInput.value.trim().length > 0) {
                enterBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            } else {
                enterBtn.classList.add('opacity-50', 'cursor-not-allowed');
            }
        }

        cards.forEach(card => {
            card.addEventListener('click', () => {
                // Haptic feedback simulation (requires secure context and compatible device in real world)
                if (window.navigator && window.navigator.vibrate) {
                    navigator.vibrate(10);
                }
                
                cards.forEach(c => c.classList.remove('active'));
                card.classList.add('active');
                selectedHostel = true;
                checkFormValidity();
            });
        });

        roomInput.addEventListener('input', checkFormValidity);

        enterBtn.addEventListener('click', (e) => {
            if (enterBtn.classList.contains('cursor-not-allowed')) {
                e.preventDefault();
                // Add a gentle shake animation to highlight missing fields
                if (!selectedHostel) {
                    document.getElementById('hostel-grid').classList.add('animate-pulse');
                    setTimeout(() => document.getElementById('hostel-grid').classList.remove('animate-pulse'), 500);
                }
            } else {
                if (window.navigator && window.navigator.vibrate) {
                    navigator.vibrate(50);
                }
                // Proceed to next screen logic here
            }
        });
    </script>
