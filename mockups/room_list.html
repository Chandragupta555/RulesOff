<body class="bg-background text-on-background font-body-md min-h-screen w-full flex justify-center overflow-x-hidden">
<!-- Mobile Container Wrapper for 390x844 preview -->
<div class="relative w-full max-w-[390px] h-[844px] bg-background shadow-2xl overflow-y-auto overflow-x-hidden border-x border-outline-variant/10">
<!-- TopAppBar (Based on Shared Components JSON) -->
<header class="sticky top-0 z-40 bg-surface/80 backdrop-blur-xl border-b border-outline-variant/30 flex justify-between items-center w-full px-container-padding h-16">
<button class="text-on-surface-variant hover:opacity-80 active:scale-95 transition-transform duration-150 flex items-center justify-center w-10 h-10 rounded-full bg-surface-container-high">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="flex flex-col items-center">
<h1 class="font-headline-md text-headline-md-mobile text-primary tracking-tighter italic">MAGGI</h1>
<p class="font-label-sm text-label-sm text-on-surface-variant">14 units across 6 rooms</p>
</div>
<button class="text-on-surface-variant hover:opacity-80 active:scale-95 transition-transform duration-150 flex items-center justify-center w-10 h-10">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</header>
<!-- Main Canvas -->
<main class="w-full px-container-padding pt-element-gap pb-[120px] flex flex-col gap-element-gap">

<div class="flex bg-surface-container-high rounded-full p-1 border border-outline-variant/20 mb-2">
<button class="flex-1 py-3 rounded-full font-label-lg text-label-lg text-on-primary bg-primary-container neon-glow active:scale-95 transition-all duration-150">
                    Pickup
                </button>
<button class="flex-1 py-3 rounded-full font-label-lg text-label-lg text-on-surface-variant hover:text-primary transition-all duration-150">
                    Delivery
                </button>
</div>
<!-- List of Room Cards -->
<div class="flex flex-col gap-base">
<!-- Card 1 -->
<div class="card-bg rounded-[24px] p-4 flex flex-col gap-3 relative overflow-hidden group hover:border-primary-container/30 transition-colors duration-300">
<div class="flex justify-between items-start">
<div>
<h2 class="font-headline-md text-headline-md-mobile text-on-surface mb-1">Room 402</h2>
<div class="flex items-center gap-2">
<span class="flex items-center gap-1 font-label-sm text-label-sm text-[#4ade80] bg-[#4ade80]/10 px-2 py-1 rounded-full">
<span class="w-2 h-2 rounded-full bg-[#4ade80] animate-pulse"></span> Awake now
                                </span>
</div>
</div>
<div class="text-right">
<span class="font-headline-md text-headline-md-mobile text-primary">3 <span class="font-label-sm text-label-sm text-on-surface-variant">units</span></span>
</div>
</div>
<div class="flex flex-wrap gap-2 mt-1">
<span class="font-label-sm text-label-sm text-on-surface-variant bg-surface-container-high px-3 py-1 rounded-full border border-outline-variant/20">Same floor</span>
<span class="font-label-sm text-label-sm text-on-surface-variant bg-surface-container-high px-3 py-1 rounded-full border border-outline-variant/20">₹12</span>
</div>
<button class="mt-2 w-full py-4 rounded-full font-headline-md text-[16px] uppercase tracking-wider text-black bg-primary-container neon-glow active:scale-95 transition-transform duration-150 haptic-target">
                        Request
                    </button>
</div>
<!-- Card 2 -->
<div class="card-bg rounded-[24px] p-4 flex flex-col gap-3 relative overflow-hidden group hover:border-primary-container/30 transition-colors duration-300">

<span class="w-2 h-2 rounded-full bg-[#4ade80] animate-pulse"></span> Awake now
                                </span>
</div>
</div>
<div class="text-right flex flex-col items-end">
<span class="font-headline-md text-headline-md-mobile text-primary">4 <span class="font-label-sm text-label-sm text-on-surface-variant">units</span></span>
<span class="font-label-sm text-[10px] text-primary/70 bg-primary/10 px-2 py-0.5 rounded-full mt-1 border border-primary/20">1 pending</span>

</div>
<div class="flex flex-wrap gap-2 mt-1">

<span class="font-label-sm text-label-sm text-on-surface-variant bg-surface-container-high px-3 py-1 rounded-full border border-outline-variant/20">₹10</span><span class="font-label-sm text-label-sm text-[#4ade80] bg-[#4ade80]/10 px-2 py-1 rounded-full border border-[#4ade80]/20">Best Price</span>

                        Request
                    </button>
</div>

<div class="card-bg rounded-[24px] p-4 flex flex-col gap-3 relative overflow-hidden group hover:border-primary-container/30 transition-colors duration-300">
<div class="flex justify-between items-start">
<div>
<h2 class="font-headline-md text-headline-md-mobile text-on-surface mb-1">Room 512</h2>
<div class="flex items-center gap-2">
<span class="flex items-center gap-1 font-label-sm text-label-sm text-[#4ade80] bg-[#4ade80]/10 px-2 py-1 rounded-full">
<span class="w-2 h-2 rounded-full bg-[#4ade80] animate-pulse"></span> Awake now
                                </span>
</div>

</div>

<span class="font-label-sm text-label-sm text-on-surface-variant bg-surface-container-high px-3 py-1 rounded-full border border-outline-variant/20">2 floors away</span>
<span class="font-label-sm text-label-sm text-on-surface-variant bg-surface-container-high px-3 py-1 rounded-full border border-outline-variant/20">₹12</span>
</div>
<button class="mt-2 w-full py-4 rounded-full font-headline-md text-[16px] uppercase tracking-wider text-black bg-primary-container neon-glow active:scale-95 transition-transform duration-150 haptic-target">

                    </button>

<button class="w-full py-3 rounded-full font-label-lg text-label-lg text-primary bg-transparent border-2 border-primary-container hover:bg-primary-container/10 active:scale-95 transition-all duration-150">
                    Suggest Restock
                </button>
</div>
</main>

<!-- Note: Nav is shown here as Shelf is active contextually, though we are in a sub-view -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pt-2 pb-safe-bottom h-20 bg-surface-container-lowest backdrop-blur-2xl shadow-[0px_-4px_20px_rgba(255,95,31,0.15)] md:hidden rounded-t-lg max-w-[390px] mx-auto">
<!-- Shelf (Active) -->
<button class="flex flex-col items-center justify-center text-primary font-bold bg-primary-container/10 rounded-xl px-3 py-1 transition-all duration-300 ease-out active:scale-90">

</button>

</button>
<!-- Profile -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary/80 transition-all duration-300 ease-out active:scale-90">
<span class="material-symbols-outlined" data-icon="person">person</span>

</button>

</div>
<script>
        // Simple haptic feedback simulation for buttons
        document.querySelectorAll('.haptic-target').forEach(button => {
            button.addEventListener('click', () => {
                if (navigator.vibrate) {
                    navigator.vibrate(50); // Medium tap
                }
            });
        });
    </script>


</body></html>
