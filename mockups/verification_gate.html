<body class="bg-background text-on-background mx-auto flex flex-col items-center justify-center relative overflow-hidden font-body-md selection:bg-primary-container selection:text-black w-[390px] h-[844px]">
<!-- Micro-illustration in corner -->

<img class="w-full h-full object-contain filter drop-shadow-[0_0_15px_rgba(255,95,31,0.2)]" data-alt="A stylized, neon-infused micro-illustration of a cold soda can covered in condensation. The can is rendered in a dark minimalist style with sharp, glowing electric orange outlines against a pitch-black void. The mood is late-night, rebellious, and highly tactile, fitting a premium campus snack culture aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA_oim5mJSRg_3rPONoJ53Jcg4HFkB8jHxs02Ealze_kadpDnYh8ZdwwEZCyiVE8mwmb5pD8-A8t5HlOSni0JuaEonPB5Q2RCt1lkd1oiXANwNVnM8JUmpRqaqRT4mpbn4RAd4v6cAqM6mUOznjGML_yDV-_scs4MK8h4aeVNKaU88JO9TgZhyL7OYB_eFiaAh9laFSLPqnlYT3zN-opAZqU89QyTW7kppqEQaifLEPXSuLCWj69Opy"/>
</div>
<!-- Floating particles for late-night atmosphere -->
<div class="absolute inset-0 pointer-events-none" id="particles-container"></div>
<!-- Main Content Canvas -->
<main class="w-full max-w-md px-container-padding flex flex-col items-center justify-center z-10">
<!-- Brand / Identity -->
<div class="mb-section-gap opacity-60">
<h2 class="font-headline-md text-headline-md font-extrabold text-primary drop-shadow-[0_0_10px_rgba(255,95,31,0.5)] tracking-widest uppercase">
                RULESOFF
            </h2>
</div>
<!-- Heading -->
<h1 class="font-headline-xl text-headline-xl text-center mb-section-gap text-on-surface">
            PROVE YOU'RE ONE OF US.
        </h1>
<!-- Form Container -->
<form class="w-full flex flex-col gap-element-gap" onsubmit="event.preventDefault(); animateVerification();">
<!-- Input Field -->
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant opacity-70" data-icon="mail">
                    mail
                </span>
<input class="w-full bg-[#1A1A1A]/50 border border-[#1F1F1F] rounded-full py-4 pl-12 pr-4 text-on-surface font-body-lg text-body-lg placeholder:text-on-surface-variant/50 focus:outline-none input-glow transition-all duration-200 backdrop-blur-md" pattern=".*@pec\.edu(\.in)?" placeholder="Enter PEC college email" required="" type="email"/>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary-container text-black font-label-lg text-label-lg rounded-full py-4 uppercase tracking-widest neon-glow transition-all duration-150 flex items-center justify-center gap-2 mt-4" id="verify-btn" type="submit">
<span>VERIFY &amp; CONTINUE</span>
<span class="material-symbols-outlined text-black font-bold" data-icon="arrow_forward" style="font-variation-settings: 'FILL' 1;">
                    arrow_forward
                </span>
</button>
<!-- Supporting Text -->
<p class="text-center font-label-sm text-label-sm text-on-surface-variant/60 mt-4 tracking-wide uppercase">
                We only let PEC students in.
            </p>
</form>
</main>
<script>
        // Simple vanilla JS for micro-interactions
        function animateVerification() {
            const btn = document.getElementById('verify-btn');
            
            // Haptic feedback simulation (if supported)
            if (navigator.vibrate) {
                navigator.vibrate(50);
            }
            
            // Loading state
            btn.innerHTML = `
                <span class="material-symbols-outlined animate-spin" data-icon="refresh">refresh</span>
                <span>VERIFYING...</span>
            `;
            btn.classList.add('opacity-80', 'scale-[0.98]');
            btn.classList.remove('neon-glow');
            
            // Simulate network request
            setTimeout(() => {
                btn.innerHTML = `
                    <span class="material-symbols-outlined" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                    <span>ACCESS GRANTED</span>
                `;
                btn.classList.remove('opacity-80', 'scale-[0.98]');
                btn.classList.add('bg-green-500', 'text-white');
                btn.style.boxShadow = '0px 4px 20px rgba(34, 197, 94, 0.4)';
                
                if (navigator.vibrate) {
                    navigator.vibrate([30, 50, 30]); // Success pattern
                }
            }, 1500);
        }

        // Lightweight atmospheric particles
        const container = document.getElementById('particles-container');
        for (let i = 0; i < 15; i++) {
            const particle = document.createElement('div');
            particle.className = 'absolute rounded-full bg-primary-container opacity-20';
            
            // Random properties
            const size = Math.random() * 4 + 1;
            const x = Math.random() * 100;
            const y = Math.random() * 100;
            const duration = Math.random() * 10 + 10;
            const delay = Math.random() * 5;
            
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${x}%`;
            particle.style.top = `${y}%`;
            
            // Animate using Web Animations API
            particle.animate([
                { transform: `translate(0, 0) scale(1)`, opacity: 0 },
                { transform: `translate(${(Math.random()-0.5)*50}px, -${Math.random()*100+50}px) scale(1.5)`, opacity: Math.random() * 0.4 },
                { transform: `translate(${(Math.random()-0.5)*100}px, -${Math.random()*200+100}px) scale(0)`, opacity: 0 }
            ], {
                duration: duration * 1000,
                delay: delay * 1000,
                iterations: Infinity,
                easing: 'ease-in-out'
            });
            
            container.appendChild(particle);
        }
    </script>
